<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#16202b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Atención al afiliado</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <p id="sin-red" class="aviso-red" role="status" hidden>Sin conexión. Vas a poder escribir cuando vuelva.</p>

  <!-- INICIO: ¿con quién querés hablar? -->
  <main id="inicio" class="vista" hidden>
    <header class="cabecera">
      <p class="app-nombre" data-app-nombre></p>
      <h1>¿Con quién querés hablar?</h1>
      <p class="bajada">Elegí la entidad y escribí tu consulta. Te contestan a cualquier hora.</p>
    </header>

    <ul id="entidades" class="entidades"></ul>

    <p class="nota">Cada conversación la atiende la entidad que elegís y queda sólo en esa entidad.</p>
    <button id="instalar" class="boton-secundario" type="button" hidden>Instalar la app en el teléfono</button>
  </main>

  <!-- CHARLA: el chat de una entidad -->
  <main id="charla" class="vista" hidden>
    <nav class="barra">
      <a class="volver" href="./" aria-label="Volver a elegir entidad">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Entidades</span>
      </a>
    </nav>

    <section class="ficha">
      <div id="charla-avatar" class="avatar avatar-grande" aria-hidden="true"></div>
      <p id="charla-que" class="que"></p>
      <h1 id="charla-titulo"></h1>
      <p id="charla-estado" class="bajada" role="status"></p>
      <div class="acciones">
        <button id="abrir-chat" class="boton" type="button" hidden>Abrir el chat</button>
        <button id="reintentar" class="boton" type="button" hidden>Reintentar</button>
        <a class="boton-secundario" href="./">Hablar con otra entidad</a>
      </div>
    </section>
  </main>

  <noscript><p class="nota" style="padding:24px">Esta app necesita JavaScript para abrir el chat.</p></noscript>

  <script src="entidades.js"></script>
  <script src="app.js"></script>
</body>
</html>
