# ══════════════════════════════════════════════════════════════════════════════════════════════
# PROPUESTA — el bloque de nginx para publicar la web app del grupo en su subdominio.
#
# NO está instalado ni probado contra el servidor: es el punto de partida para el día que se
# defina el subdominio. Sale de leer deploy/apify/nginx/apify.conf y apify-backend.conf (de ahí
# vienen `apify_backend` y las cabeceras de los reenvíos) y platform/api/lib/seguridad.js (de ahí
# viene la política de contenido que el chat necesita).
#
# Antes de usarlo: reemplazar SUBDOMINIO y PLATAFORMA (el dominio del sistema, hoy app.temacy.ar),
# emitir el certificado, y revisar las cuatro advertencias.
#
# ⚠ 1. Un subdominio SIN bloque propio cae en el `server_name … _` de apify.conf y sirve el panel
#      de gestión con 200. Hasta que este bloque esté cargado, el subdominio no tiene que apuntar a
#      la máquina (o tiene que haber un bloque que conteste 444).
# ⚠ 2. NO incluir snippets/apify-backend.conf: expondría en este dominio toda la API y las páginas
#      de la plataforma. Acá se reenvía sólo lo que usa el chat.
# ⚠ 3. `add_header` no se hereda en un `location` que define el suyo: por eso las cabeceras de
#      seguridad se repiten en cada uno (ya pasó en apify.conf, ver su comentario P-20).
# ⚠ 4. En este dominio NO se sirve nada que haya subido alguien. El navegador guarda acá las
#      credenciales de las conversaciones con las TRES entidades; un HTML o un SVG subido a la
#      plataforma que se abriera en este dominio podría leerlas. Por eso /uploads/, /brands/ y
#      /privacidad/ no se reenvían: se redirigen al dominio de la plataforma. No cambiar eso por
#      un `proxy_pass` «para que quede más prolijo».
# ══════════════════════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name SUBDOMINIO;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://SUBDOMINIO$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name SUBDOMINIO;

    ssl_certificate     /etc/letsencrypt/live/SUBDOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SUBDOMINIO/privkey.pem;

    # El contenido de web_grupo/v2/ (sin LEEME.md). Fuera de platform/, para que ningún deploy de la
    # plataforma lo pise, igual que la web de Temacy en ~/apps/apify/landing.
    root  /home/ubuntu/apps/apify/grupo;
    index index.html;

    client_max_body_size 12m;   # los adjuntos que la persona manda por el chat

    # ── Las páginas de la app ────────────────────────────────────────────────────────────────
    # La app (index.html) no se puede meter en un marco de otro sitio y sólo carga cosas propias,
    # más los logos de las entidades (https) y sus propios marcos.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; frame-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }
    location = / { rewrite ^ /index.html last; }

    # El marco de cada chat (charla.html) aloja el chat de la plataforma. Necesita lo mismo que el
    # chat pide en cualquier página (seguridad.js › DIRECTIVAS): estilos en línea (el chat inyecta
    # su hoja de estilos), imágenes y medios de https/data/blob, el socket, y los marcos de video y
    # mapas. Sólo lo puede enmarcar la propia app.
    location = /charla.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' wss://SUBDOMINIO; frame-src https://www.youtube-nocookie.com https://player.vimeo.com https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;
    }

    # El resto de los archivos de la app (scripts, estilos, íconos, manifiesto, service worker).
    # Sin caché larga: la app tiene su propia copia guardada y se pone al día sola (ver sw.js).
    location / {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    # ── A la API de la plataforma: sólo lo que el chat necesita ──────────────────────────────
    # En todas va `Host $host` (la API deja pasar al chat cuando la página y ella están en el mismo
    # dominio: lib/origenes.js › hostPropio) y la IP real del visitante (los frenos de la API
    # cuentan por IP; sin esto, todos los afiliados contarían como uno solo).

    # El chat: configuración, mensajes, adjuntos, trámites.
    location ^~ /api/web-chat/ {
        proxy_pass http://apify_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        # Los adjuntos de una conversación salen por acá (/api/web-chat/media/). Si alguien abre uno
        # en una pestaña, que no pueda correr código en este dominio.
        add_header Content-Security-Policy "script-src 'none'; object-src 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # El resto de la API no existe en este dominio.
    location /api/ { return 404; }

    # Los mensajes en vivo. `^~` para que le gane a cualquier regla por extensión (\.js$): sin eso
    # /socket.io/socket.io.js da 404 y el chat cae a preguntar cada 4 segundos (pasó el 30-07).
    location ^~ /socket.io/ {
        proxy_pass http://apify_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # El chat mismo: es código de la plataforma, el mismo que cargan los sitios de las entidades.
    location = /widget.js { proxy_pass http://apify_backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }

    # ── Lo que NO se sirve acá: se manda a buscar a la plataforma (advertencia 4) ────────────
    # Los logos de las entidades, las imágenes y archivos que manda el bot, y el aviso de privacidad
    # de cada entidad. El chat los pide con la dirección de este dominio; se le contesta dónde están.
    location ^~ /uploads/    { return 302 https://PLATAFORMA$request_uri; }
    location ^~ /brands/     { return 302 https://PLATAFORMA$request_uri; }
    location ^~ /privacidad/ { return 302 https://PLATAFORMA$request_uri; }
}
