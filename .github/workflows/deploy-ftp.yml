# Publica la web app en web.temacy.com/suvico-app en cada push a main.
# 1) Si hay package.json, instala y hace el build con la subruta /suvico-app/.
#    Si no, publica los archivos de la app tal cual (sitio estático): sólo la app, no el
#    repo entero (ver el paso «Juntar los archivos a publicar»).
#    Si todavía no hay index.html, publica una página de "Próximamente".
# 2) Agrega <meta name="robots" content="noindex"> a cada HTML y un .htaccess
#    con noindex y sin caché para los archivos de la app. Revisa que estén los archivos de sw.js.
# 3) Copia el resultado a la carpeta suvico-app/ del repo temacy-webs y lo empuja a main.
#    Hostinger despliega temacy-webs por Git en public_html/web, y ese deploy borra lo que
#    no esté en el repo: por eso la app no se sube más por FTP (el 18-11 la borró).
#    Necesita el secret WEBS_TOKEN: token con permiso Contents (lectura y escritura) en temacy-webs.
name: Publicar en web.temacy.com/suvico-app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

env:
  BASE_PATH: /suvico-app/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el repo
        uses: actions/checkout@v4

      - name: Preparar Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        if: hashFiles('package.json') != ''
        env:
          PUBLIC_URL: /suvico-app          # Create React App
          VITE_BASE_PATH: /suvico-app/     # por si el vite.config lo lee
          NEXT_PUBLIC_BASE_PATH: /suvico-app
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          if ls vite.config.* >/dev/null 2>&1; then
            npx vite build --base="$BASE_PATH"
          else
            npm run build
          fi

      - name: Juntar los archivos a publicar
        id: juntar
        run: |
          mkdir -p _publicar
          if [ -f package.json ]; then
            for d in dist build out; do
              if [ -f "$d/index.html" ]; then cp -a "$d/." _publicar/; break; fi
            done
          else
            # Sitio estático: se publica SÓLO la app, no el repo entero. La app son los .html, .js y
            # .css de la raíz, el manifiesto y las carpetas icons/ y fuentes/ (la lista ARCHIVOS de
            # sw.js, más el propio sw.js). Todo lo demás queda afuera sin tener que nombrarlo: docs/,
            # referencia/, pruebas/, herramientas/, .claude/, los .md y servidor-local.js.
            rsync -a \
              --exclude='/servidor-local.js' \
              --include='/*.html' --include='/*.js' --include='/*.css' \
              --include='/manifest.webmanifest' \
              --include='/icons/***' --include='/fuentes/***' \
              --exclude='*' \
              ./ _publicar/
          fi
          if [ ! -f _publicar/index.html ]; then
            echo "::warning::Todavía no hay app; se publica una página de 'Próximamente'."
            cp .github/deploy/proximamente.html _publicar/index.html
          fi
          # El service worker solo se actualiza si están TODOS los archivos de su lista.
          if [ -f _publicar/sw.js ]; then
            faltan=0
            for a in $(sed -n "/const ARCHIVOS/,/];/p" _publicar/sw.js | grep -o "'[^']*'" | tr -d "'"); do
              [ -z "$a" ] && continue
              [ -f "_publicar/$a" ] || { echo "::error::Falta $a (está en la lista de sw.js)"; faltan=1; }
            done
            [ "$faltan" = 0 ] || exit 1
          fi
          # El sello de esta publicación: el identificador del commit. sw.js y las páginas piden
          # los archivos con ese sello en la dirección, así el teléfono se entera de que hay una
          # publicación nueva y ningún intermediario le devuelve los archivos de la anterior.
          sello="${GITHUB_SHA::8}"
          for f in _publicar/sw.js _publicar/index.html _publicar/charla.html; do
            if [ -f "$f" ]; then sed -i "s/__SELLO__/$sello/g" "$f"; fi
          done
          if grep -rq '__SELLO__' _publicar --include='*.html' --include='*.js'; then
            echo "::error::Quedó un __SELLO__ sin reemplazar"; exit 1
          fi
          echo "hay=si" >> "$GITHUB_OUTPUT"
          cp .github/deploy/htaccess _publicar/.htaccess
          # meta noindex en cada HTML que no la tenga
          find _publicar -name '*.html' -print0 | while IFS= read -r -d '' f; do
            grep -qi 'name="robots"' "$f" || sed -i '0,/<head[^>]*>/I s//&\n    <meta name="robots" content="noindex, nofollow">/' "$f"
          done
          ls -la _publicar

      - name: Copiar la app a temacy-webs/suvico-app
        if: steps.juntar.outputs.hay == 'si'
        env:
          WEBS_TOKEN: ${{ secrets.WEBS_TOKEN }}
        run: |
          if [ -z "$WEBS_TOKEN" ]; then
            echo "::error::Falta el secret WEBS_TOKEN (token con permiso de escritura en SoyMatiLucero/temacy-webs)."
            exit 1
          fi
          git clone --depth 20 "https://x-access-token:${WEBS_TOKEN}@github.com/SoyMatiLucero/temacy-webs.git" _webs
          mkdir -p _webs/suvico-app
          rsync -a --delete _publicar/ _webs/suvico-app/
          cd _webs
          git add -A suvico-app
          if git diff --cached --quiet; then echo "Sin cambios para publicar."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898708+github-actions[bot]@users.noreply.github.com" \
            commit -m "suvico-app: publicación de ${GITHUB_REPOSITORY}@${GITHUB_SHA::8}"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
