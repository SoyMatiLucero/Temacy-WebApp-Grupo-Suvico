<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Imagen para compartir</title>
  <!--
    La imagen que se ve al compartir el enlace de la app (WhatsApp, redes): 1200×630.
    No es parte de la app. `node herramientas/compartir.js` la dibuja y la guarda en
    icons/compartir.png, que es la que nombra index.html en `og:image`.
    Usa la misma piel que la app: grafito, luz blanca y el color sólo en cada entidad.
    Si cambia el nombre de la app o una entidad, se cambia acá y se vuelve a generar.
  -->
  <style>
    @font-face { font-family: "Cabinet Grotesk"; font-weight: 800; src: url("../fuentes/cabinet-grotesk-800.woff2") format("woff2"); }
    @font-face { font-family: "Satoshi"; font-weight: 500; src: url("../fuentes/satoshi-500.woff2") format("woff2"); }
    @font-face { font-family: "Satoshi"; font-weight: 700; src: url("../fuentes/satoshi-700.woff2") format("woff2"); }
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative; padding: 68px 76px; color: #f4f6f8; font-family: "Satoshi", system-ui, sans-serif;
      background:
        radial-gradient(760px 520px at 88% -8%, rgba(255, 255, 255, .13), transparent 70%),
        radial-gradient(620px 460px at 4% 108%, rgba(160, 190, 220, .10), transparent 70%),
        #0b0d10;
    }
    .rotulo { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 22px; letter-spacing: .2em; color: #aeb6c0; }
    .rotulo svg { width: 30px; height: 30px; }
    h1 { margin-top: 30px; font-family: "Cabinet Grotesk", system-ui, sans-serif; font-weight: 800; font-size: 132px; line-height: 1; letter-spacing: -.035em; }
    h1 span { color: #7f8894; }
    p { margin-top: 26px; max-width: 880px; font-weight: 500; font-size: 36px; line-height: 1.3; color: #c9d0d8; }
    .entidades { position: absolute; left: 76px; right: 76px; bottom: 64px; display: flex; gap: 18px; }
    .entidad {
      flex: 1; display: flex; align-items: center; gap: 16px; padding: 22px 24px; border-radius: 26px;
      border: 1px solid rgba(255, 255, 255, .14);
      background: linear-gradient(120deg, color-mix(in srgb, var(--marca) 26%, transparent), rgba(255, 255, 255, .04) 62%);
    }
    .punto { flex: none; width: 18px; height: 18px; border-radius: 50%; background: var(--marca); box-shadow: 0 0 22px var(--marca); }
    .entidad b { display: block; font-family: "Cabinet Grotesk", system-ui, sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -.01em; }
    .entidad small { display: block; margin-top: 2px; font-weight: 500; font-size: 22px; color: #b6bec8; }
  </style>
</head>
<body>
  <div class="rotulo">
    <svg viewBox="0 0 24 24" fill="#aeb6c0" aria-hidden="true"><path d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm3.5 8.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm4.5 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm4.5 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/></svg>
    ATENCIÓN AL AFILIADO
  </div>
  <h1><span>¿Qué</span> necesitás?</h1>
  <p>Escribí tu consulta y elegí quién te la resuelve: el sindicato, la mutual o la obra social.</p>
  <div class="entidades">
    <div class="entidad" style="--marca: #DF040B"><i class="punto"></i><div><b>SUVICO</b><small>El sindicato</small></div></div>
    <div class="entidad" style="--marca: #30C0D8"><i class="punto"></i><div><b>Mavic</b><small>La mutual</small></div></div>
    <div class="entidad" style="--marca: #10C0D0"><i class="punto"></i><div><b>OSPEVIC</b><small>La obra social</small></div></div>
  </div>
</body>
</html>
